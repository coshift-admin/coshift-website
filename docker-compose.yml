services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CALENDLY_URL: ${NEXT_PUBLIC_CALENDLY_URL}
        NEXT_PUBLIC_SITE_URL:     ${NEXT_PUBLIC_SITE_URL}
    image: coshift:latest
    container_name: coshift-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 200
